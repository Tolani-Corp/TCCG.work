name: TCCG Digital Launch CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - agent/digital-launch-phase

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate digital launch source files
        run: |
          test -f src/lib/digitalLaunch.ts
          test -f src/components/DigitalLaunchCommandCenter.tsx
          test -f src/app/digital-launch/page.tsx
          test -f src/app/api/digital-launch/route.ts
          test -f docs/digital-launch/TCCG_DIGITAL_LAUNCH_PLAYBOOK.md
          test -f docs/growth/TCCG_CAPABILITIES_STATEMENT.md

      - name: Build production application
        run: pnpm build
